<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>maya</title>
<style>
  /* ─────────────────────────────────────────────────────────────
     Maya HUD — "readable glass"
     Adapted from saarthi. Same solid dark panel + glass rim,
     extended with Maya's state set: listening, speaking, awaiting.
     ───────────────────────────────────────────────────────────── */

  :root {
    --panel:     rgba(19, 20, 25, 0.96);
    --panel-2:   #15161A;
    --rim:       rgba(255, 255, 255, 0.14);
    --rim-soft:  rgba(255, 255, 255, 0.07);
    --hairline:  rgba(255, 255, 255, 0.08);

    --ink:       #F2F0EA;
    --ink-2:     rgba(242, 240, 234, 0.76);
    --ink-3:     rgba(242, 240, 234, 0.52);
    --ink-4:     rgba(242, 240, 234, 0.34);

    --sclera:    #F2EFE6;
    --pupil:     #15161A;

    --accent:      #6272a4;
    --accent-soft: rgba(98, 114, 164, 0.18);
    --done:        #57D6A6;
    --error:       #FF6B6B;
    --read:        #7FB2E6;

    --mono: "JetBrains Mono", "Iosevka", "Fira Code", "DejaVu Sans Mono",
            ui-monospace, SFMono-Regular, Menlo, monospace;
    --r: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
    cursor: default;
    user-select: none;
  }

  body {
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    padding: 3px;
  }

  /* ── per-state accent colours ────────────────────────────── */
  body[data-state="thinking"] { --accent: #FFB454; --accent-soft: rgba(255,180,84,0.18); }
  body[data-state="acting"]   { --accent: #bd93f9; --accent-soft: rgba(189,147,249,0.18); }
  body[data-state="listening"]{ --accent: #50fa7b; --accent-soft: rgba(80,250,123,0.18); }
  body[data-state="speaking"] { --accent: #f1fa8c; --accent-soft: rgba(241,250,140,0.18); }
  body[data-state="awaiting"] { --accent: #ffb86c; --accent-soft: rgba(255,184,108,0.18); }
  body[data-state="error"]    { --accent: var(--error); --accent-soft: rgba(255,107,107,0.18); }

  /* ── card ─────────────────────────────────────────────────── */
  .hud {
    width: 340px;
    position: relative;
    background: var(--panel);
    border: 1px solid var(--rim);
    border-radius: var(--r);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    box-shadow:
      0 1px 0 var(--rim-soft) inset,
      0 0 0 0.5px rgba(0,0,0,0.4),
      0 26px 52px -16px rgba(0,0,0,0.78),
      0 6px 16px -6px rgba(0,0,0,0.6);
    overflow: hidden;
    transform-origin: top right;
    animation: hud-in 460ms cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes hud-in {
    from { opacity: 0; transform: translateY(-10px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .hud::before {
    content: "";
    position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    background-size: 340px 100%;
    opacity: 0; transition: opacity .5s ease;
  }
  body[data-state="thinking"] .hud::before,
  body[data-state="acting"]   .hud::before { opacity: .9; animation: sweep 2.4s linear infinite; }
  body[data-state="listening"] .hud::before { opacity: .7; animation: sweep 1.6s linear infinite; }
  body[data-state="speaking"]  .hud::before { opacity: .5; }
  body[data-state="awaiting"]  .hud::before { opacity: .5; animation: pulse-border 1.8s ease-in-out infinite; }
  @keyframes sweep        { 0% { background-position: -340px 0; } 100% { background-position: 340px 0; } }
  @keyframes pulse-border { 0%,100% { opacity: .3; } 50% { opacity: .8; } }

  /* ── header ──────────────────────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 13px;
    padding: 15px 16px 13px;
    border-bottom: 1px solid var(--hairline);
  }
  .face { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
  .eye {
    position: relative; width: 21px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 36%, #ffffff 0%, var(--sclera) 58%, #d9d5c8 100%);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25) inset;
    overflow: hidden;
    transition: box-shadow .4s ease;
  }
  body[data-state="thinking"] .eye,
  body[data-state="acting"]   .eye { animation: eyeglow 1.8s ease-in-out infinite; }
  body[data-state="listening"] .eye { animation: eyeglow-listen 1.2s ease-in-out infinite; }
  @keyframes eyeglow {
    0%,100% { box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset, 0 0 7px 0 var(--accent-soft); }
    50%     { box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset, 0 0 13px 2px var(--accent-soft); }
  }
  @keyframes eyeglow-listen {
    0%,100% { box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset, 0 0 8px 2px rgba(80,250,123,0.3); }
    50%     { box-shadow: 0 0 0 1px rgba(0,0,0,.25) inset, 0 0 16px 4px rgba(80,250,123,0.5); }
  }
  .lid {
    position: absolute; left: -2px; right: -2px; top: -2px; height: 0%;
    background: var(--panel-2);
    border-bottom: 1px solid rgba(0,0,0,0.4);
    border-radius: 0 0 50% 50% / 0 0 15px 15px;
    transition: height .12s ease; z-index: 3;
  }
  .lid.bottom { top: auto; bottom: -2px; border-radius: 50% 50% 0 0 / 15px 15px 0 0; border-bottom: none; }
  .pupil {
    position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #3a3b42 0%, var(--pupil) 55%);
    transform: translate(var(--px, 0px), var(--py, 0px));
    transition: transform .18s cubic-bezier(.5,0,.2,1); z-index: 2;
  }
  .pupil::after {
    content: ""; position: absolute; left: 2px; top: 1.5px;
    width: 3.6px; height: 3.6px; border-radius: 50%;
    background: rgba(255,255,255,.9); filter: blur(.3px);
  }

  .brand { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
  .brand .name { font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: lowercase; }
  .brand .name b { color: var(--accent); font-weight: 700; transition: color .4s ease; }

  .state { display: flex; align-items: center; gap: 7px; flex: none; }
  .spinner {
    width: 13px; height: 13px; border-radius: 50%;
    border: 2px solid var(--accent-soft); border-top-color: var(--accent);
    animation: spin .7s linear infinite; opacity: 0; transition: opacity .3s ease;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); transition: background .4s ease; }
  .state .label { font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
  .state .count { font-size: 10.5px; letter-spacing: .04em; color: var(--ink-4); }
  .state .count:empty { display: none; }

  body[data-state="thinking"] .spinner,
  body[data-state="acting"]   .spinner { opacity: 1; }
  body[data-state="thinking"] .state .dot,
  body[data-state="acting"]   .state .dot { display: none; }

  body[data-state="listening"] .spinner { opacity: 1; animation: pulse-spin .9s ease-in-out infinite; }
  body[data-state="listening"] .state .dot { display: none; }
  @keyframes pulse-spin {
    0%,100% { opacity: .7; }
    50%     { opacity: 1; transform: scale(1.1); }
  }

  body:not([data-state="idle"]) .state .label { color: var(--accent); }
  body[data-state="idle"]     .state .dot,
  body[data-state="speaking"] .state .dot,
  body[data-state="awaiting"] .state .dot,
  body[data-state="error"]    .state .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* ── hero now line ───────────────────────────────────────── */
  .now {
    padding: 14px 16px; display: flex; align-items: center; gap: 11px; min-height: 50px;
  }
  .now .glyph { font-size: 16px; line-height: 1; color: var(--accent); flex: none; width: 18px; text-align: center; }
  body[data-state="thinking"] .now .glyph,
  body[data-state="acting"]   .now .glyph { animation: spin 1.1s linear infinite; }
  .now .text {
    font-size: 15px; font-weight: 500; letter-spacing: .005em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  body[data-state="thinking"] .now .text,
  body[data-state="acting"]   .now .text { color: var(--ink); }
  body:not([data-state="thinking"]):not([data-state="acting"]) .now .text { color: var(--ink-2); }

  /* ── listening panel ─────────────────────────────────────── */
  #listen-panel {
    display: none;
    border-top: 1px solid var(--hairline);
    padding: 14px 16px 18px;
    text-align: center;
  }
  body[data-state="listening"] #listen-panel { display: block; }
  .mic-ring {
    display: inline-flex; align-items: center; justify-content: center;
    width: 50px; height: 50px; border-radius: 50%;
    border: 2px solid var(--accent);
    margin-bottom: 10px;
    animation: mic-pulse 1.4s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%  { box-shadow: 0 0 0 0   rgba(80,250,123,0.25); }
    50% { box-shadow: 0 0 0 10px transparent; }
    100%{ box-shadow: 0 0 0 0   rgba(80,250,123,0.25); }
  }
  .mic-icon { font-size: 22px; }
  .listen-prompt { font-size: 14px; font-weight: 700; letter-spacing: .03em; color: var(--accent); margin-bottom: 5px; }
  .listen-hint   { font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em; }

  /* ── speaking panel ──────────────────────────────────────── */
  #speak-panel {
    display: none;
    border-top: 1px solid var(--hairline);
    padding: 10px 16px 12px;
  }
  body[data-state="speaking"] #speak-panel { display: block; }
  .speak-caption {
    font-size: 13px; color: var(--ink-2); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── awaiting / confirm panel ────────────────────────────── */
  #confirm-panel {
    display: none;
    border-top: 1px solid var(--hairline);
    padding: 12px 16px 14px;
  }
  body[data-state="awaiting"] #confirm-panel { display: block; }
  .confirm-label {
    font-size: 9.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 7px;
  }
  .confirm-prompt { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1; padding: 8px 0; border-radius: 9px; border: 1px solid;
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: .06em; cursor: pointer; transition: background .15s ease, opacity .15s;
  }
  .btn:hover  { opacity: .85; }
  .btn:active { opacity: .7; }
  .btn-approve { background: rgba(80,250,123,0.12); color: #50fa7b; border-color: rgba(80,250,123,0.35); }
  .btn-deny    { background: rgba(255,107,107,0.12); color: #ff6b6b; border-color: rgba(255,107,107,0.35); }

  /* ── feed / task list ────────────────────────────────────── */
  .feed { border-top: 1px solid var(--hairline); padding: 8px 8px 10px; display: flex; flex-direction: column; }
  .feed-title { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: var(--ink-4); padding: 4px 8px 7px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 9px; animation: row-in .42s cubic-bezier(.16,1,.3,1) both; }
  @keyframes row-in { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: none; } }
  .row .ico { width: 14px; flex: none; text-align: center; font-size: 12px; line-height: 1; color: var(--ink-3); }
  .row .lbl { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row[data-st="running"] { background: var(--accent-soft); }
  .row[data-st="running"] .ico { color: var(--accent); animation: spin 1.1s linear infinite; }
  .row[data-st="running"] .lbl { color: var(--ink); }
  .row[data-st="done"]   .ico { color: var(--done); }
  .row[data-st="failed"] { background: rgba(255,107,107,0.10); }
  .row[data-st="failed"] .ico { color: var(--error); }
  .row[data-st="failed"] .lbl { color: #ffd0d0; }
  .feed:empty { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    .spinner { border-top-color: var(--accent); }
  }
</style>
</head>
<body data-state="idle">
  <div class="hud" role="status" aria-live="polite">

    <header>
      <div class="face" aria-hidden="true">
        <div class="eye"><div class="pupil"></div><div class="lid top"></div><div class="lid bottom"></div></div>
        <div class="eye"><div class="pupil"></div><div class="lid top"></div><div class="lid bottom"></div></div>
      </div>
      <div class="brand"><div class="name"><b>maya</b></div></div>
      <div class="state">
        <div class="spinner"></div>
        <div class="dot"></div>
        <div class="label" id="stateLabel">idle</div>
        <div class="count" id="stateCount"></div>
      </div>
    </header>

    <div class="now">
      <div class="glyph" id="nowGlyph">✓</div>
      <div class="text"  id="nowText">standing by</div>
    </div>

    <div id="listen-panel">
      <div class="mic-ring"><span class="mic-icon">🎙</span></div>
      <div class="listen-prompt">You can speak now</div>
      <div class="listen-hint">say your next task · or "stop"</div>
    </div>

    <div id="speak-panel">
      <div class="speak-caption" id="speakCaption"></div>
    </div>

    <div id="confirm-panel">
      <div class="confirm-label">confirmation needed</div>
      <div class="confirm-prompt" id="confirmPrompt"></div>
      <div class="btn-row">
        <button class="btn btn-approve" id="btnApprove">✓ approve</button>
        <button class="btn btn-deny"    id="btnDeny">✗ deny</button>
      </div>
    </div>

    <div class="feed" id="feed"></div>
  </div>

<script>
(() => {
  "use strict";

  const body       = document.body;
  const pupils     = document.querySelectorAll(".pupil");
  const lidTops    = document.querySelectorAll(".lid.top");
  const lidBots    = document.querySelectorAll(".lid.bottom");
  const stateEl    = document.getElementById("stateLabel");
  const countEl    = document.getElementById("stateCount");
  const nowText    = document.getElementById("nowText");
  const nowGlyph   = document.getElementById("nowGlyph");
  const feed       = document.getElementById("feed");
  const speakCap   = document.getElementById("speakCaption");
  const confirmPmt = document.getElementById("confirmPrompt");
  const btnApprove = document.getElementById("btnApprove");
  const btnDeny    = document.getElementById("btnDeny");

  const GLYPH = { running: "⟳", done: "✓", failed: "✗", pending: "·" };
  const LABEL = { idle:"idle", listening:"listening", thinking:"thinking", acting:"acting", speaking:"speaking", awaiting:"waiting", error:"error" };

  let state = "idle";
  let seed  = 1;

  // ── eye animation ─────────────────────────────────────────
  let saccadeT = 0, blinkT = 0;
  function look(dx, dy) {
    pupils.forEach(p => { p.style.setProperty("--px", dx+"px"); p.style.setProperty("--py", dy+"px"); });
  }
  function blink(amount) {
    lidTops.forEach(l => l.style.height = Math.round(amount*72)+"%");
    lidBots.forEach(l => l.style.height = Math.round(amount*34)+"%");
  }
  function seededUnit(n) { const x = Math.sin((seed+n)*12.9898)*43758.5453; return x-Math.floor(x); }

  function tick(ts) {
    if (state === "thinking" || state === "acting") {
      if (ts > saccadeT) {
        const n = Math.floor(ts/520), a = seededUnit(n)*Math.PI*2, r = 1+seededUnit(n+41)*3;
        look(Math.cos(a)*r, Math.sin(a)*r);
        saccadeT = ts + 520 + seededUnit(n+7)*820;
      }
      if (ts > blinkT) {
        blink(1); setTimeout(() => blink(0), 95);
        blinkT = ts + 1800 + seededUnit(Math.floor(ts/1700)+9)*3200;
      }
    } else if (state === "listening") {
      look(0, -2); blink(0.05);
    } else if (state === "speaking") {
      const n = Math.floor(ts/400);
      look((seededUnit(n)-.5)*2, (seededUnit(n+3)-.5)*2); blink(0.1);
    } else if (state === "awaiting") {
      look(0, 1); blink(0.15);
    } else if (state === "error") {
      look(0, -1); blink(0.08);
    } else {
      look(0, 4); blink(0.55);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ── state management ──────────────────────────────────────
  function setState(s) {
    if (s === state) return;
    state = s;
    body.setAttribute("data-state", s);
    stateEl.textContent = LABEL[s] || s;
    if (s === "thinking" || s === "acting") { saccadeT = 0; blinkT = performance.now()+1200; }
  }

  // ── render Maya snapshot ──────────────────────────────────
  // Snapshot: { state, caption, tasks: [{id,label,status,detail?}], confirmation?: {prompt,category} }
  function render(snap) {
    if (!snap) return;
    const s = snap.state || "idle";
    setState(s);

    const tasks = snap.tasks || [];
    countEl.textContent = tasks.length ? "· "+tasks.length : "";

    // hero line
    const icons = { idle:"✓", listening:"🎙", thinking:"⟳", acting:"⟳", speaking:"◎", awaiting:"?", error:"✗" };
    const heroText = {
      idle:      "standing by",
      listening: "mic open…",
      thinking:  "thinking…",
      acting:    snap.caption || "working…",
      speaking:  snap.caption || "speaking…",
      awaiting:  "your call",
      error:     snap.caption || "something went wrong",
    };
    nowGlyph.textContent = icons[s] || "·";
    nowText.textContent  = heroText[s] || snap.caption || s;

    // speaking caption (show what Maya is saying)
    speakCap.textContent = (s === "speaking" && snap.caption) ? snap.caption : "";

    // confirm panel
    confirmPmt.textContent = (s === "awaiting" && snap.confirmation) ? snap.confirmation.prompt : "";

    // task feed
    drawFeed(tasks);
  }

  const rowEls = new Map();
  function drawFeed(tasks) {
    const ids = new Set(tasks.map(t => String(t.id)));
    for (const [id, el] of rowEls) { if (!ids.has(id)) { el.remove(); rowEls.delete(id); } }
    let titled = feed.querySelector(".feed-title");
    if (tasks.length && !titled) {
      titled = document.createElement("div"); titled.className = "feed-title"; titled.textContent = "steps";
      feed.appendChild(titled);
    } else if (!tasks.length && titled) { titled.remove(); }
    for (const t of tasks) {
      const id = String(t.id);
      let el = rowEls.get(id);
      if (!el) {
        el = document.createElement("div"); el.className = "row";
        el.innerHTML = '<span class="ico"></span><span class="lbl"></span>';
        rowEls.set(id, el); feed.appendChild(el);
      }
      el.dataset.st = t.status || "pending";
      el.querySelector(".ico").textContent = GLYPH[t.status] || "·";
      el.querySelector(".lbl").textContent = t.detail ? t.label+" · "+t.detail : t.label;
    }
    for (const t of tasks) { const el = rowEls.get(String(t.id)); if (el) feed.appendChild(el); }
  }

  // ── host ↔ page bridge ────────────────────────────────────
  function postToHost(msg) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.maya) {
      window.webkit.messageHandlers.maya.postMessage(JSON.stringify(msg));
    }
  }

  btnApprove.addEventListener("click", () => postToHost({ type: "answer", approved: true  }));
  btnDeny   .addEventListener("click", () => postToHost({ type: "answer", approved: false }));
  document.addEventListener("keydown", e => { if (e.key === "Escape") postToHost({ type: "abort" }); });

  // Called by host.py via WebKit JS eval
  window.mayaUpdate = function(snap) {
    try { render(typeof snap === "string" ? JSON.parse(snap) : snap); }
    catch(e) { /* ignore malformed push */ }
  };

})();
</script>
</body>
</html>
