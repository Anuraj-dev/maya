name: CI

# Tests run remotely on GitHub so contributor/agent machines never spend RAM on the suite.
# The coder/reviewer handshake gates on this workflow's status, not on any local `bun test`.

on:
  pull_request:
  push:
    branches: ["feat/initial-implementation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Run tests
        run: bun test
